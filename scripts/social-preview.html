<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Portfolio social preview artwork</title>
    <style>
      @import url("../src/theme.css");
      body {
        margin: 0;
        background: var(--color-background);
        color: var(--color-text);
        font-family: Arial, sans-serif;
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 55px 70px;
      }
      .mark {
        font-size: 38px;
        font-weight: bold;
        letter-spacing: -3px;
        color: var(--color-primary);
      }
      .name {
        font-size: 15px;
        letter-spacing: 2px;
        color: var(--color-text-secondary);
        margin-top: 30px;
      }
      h1 {
        font-size: 86px;
        letter-spacing: -4px;
        line-height: 1.06;
        font-weight: 400;
        margin: 37px 0;
      }
      em {
        font-family: Georgia, serif;
        color: var(--color-primary);
      }
      footer {
        border-top: 1px solid var(--color-border);
        padding-top: 25px;
        font-size: 16px;
        color: var(--color-text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="mark">ahk.</div>
    <div class="name">AMIR HESAM KHALOUEI / SENIOR PRODUCT DESIGNER</div>
    <h1>Designing <em>clarity</em><br />into complex<br />digital products.</h1>
    <footer>8+ years · Product Strategy · UX Research · Design Systems</footer>
  </body>
</html>
